name: hermes-stage
label: Hermes Stage
kind: standalone
version: "0.66.1"
description: >-
  Hermes Stage launches a multi-profile terminal bot room over Hermes' local gateway.
  It owns one shared room transcript with profile lens tabs; messages can target one
  profile, everyone, or the whole room. It includes Stage-specific status, tool, and
  diff cards.
author: David Philipe Gil
license: MIT
requires_hermes: ">=0.23.1"
platforms:
  - linux
  - macos
external_dependencies:
  - name: node
    check: "node -e \"process.exit(process.versions.node.split('.')[0] >= 22 ? 0 : 1)\""
provides_tools: []
provides_hooks: []
requires_env: []
